<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA转运 — 重置密码</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:#F4F4F2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:#fff; border-radius:20px; padding:40px 36px; width:100%; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.08); }
.logo { font-family:'Noto Serif SC',serif; font-size:20px; font-weight:700; color:#C8102E; text-align:center; margin-bottom:24px; }
h2 { font-size:22px; font-weight:700; margin-bottom:6px; text-align:center; }
p { font-size:14px; color:#6B6B6B; text-align:center; margin-bottom:24px; }
.form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.form-group label { font-size:13px; font-weight:600; }
.form-group input { padding:12px 14px; border:1.5px solid #E8E4DE; border-radius:8px; font-size:15px; outline:none; font-family:inherit; transition:border-color 0.2s; }
.form-group input:focus { border-color:#C8102E; }
.btn { width:100%; padding:13px; background:#C8102E; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; margin-top:8px; }
.btn:hover { background:#9B0C22; }
.msg { padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none; }
.msg.error { background:#fff0f0; color:#c00; border:1px solid #f0c0c0; }
.msg.success { background:#e6f4ea; color:#1a7a35; border:1px solid #b2dfb8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">CA转运</div>
  <h2>设置新密码</h2>
  <p>请输入您的新密码</p>
  <div id="msg" class="msg"></div>
  <div class="form-group">
    <label>新密码</label>
    <input type="password" id="new-password" placeholder="至少6位">
  </div>
  <div class="form-group">
    <label>确认密码</label>
    <input type="password" id="confirm-password" placeholder="再次输入新密码">
  </div>
  <button class="btn" id="btn-reset" onclick="doReset()">确认修改</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sbClient = window.supabase.createClient(
  'https://diukvdvfpfsftmjzwulp.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpdWt2ZHZmcGZzZnRtanp3dWxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2OTU5NjAsImV4cCI6MjA5MzI3MTk2MH0.5UPgAUbhPXJhfnVuw4fF4YJe-AEOn2hWmrpeP46TzFA'
);

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

async function doReset() {
  const pwd = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;
  if (!pwd || pwd.length < 6) { showMsg('密码至少需要6位', 'error'); return; }
  if (pwd !== confirm) { showMsg('两次密码不一致', 'error'); return; }
  const btn = document.getElementById('btn-reset');
  btn.disabled = true; btn.textContent = '修改中…';
  const { error } = await sbClient.auth.updateUser({ password: pwd });
  btn.disabled = false; btn.textContent = '确认修改';
  if (error) { showMsg('修改失败：' + error.message, 'error'); return; }
  showMsg('密码修改成功！正在跳转…', 'success');
  setTimeout(() => window.location.href = 'dashboard.html', 2000);
}
</script>
</body>
</html>
